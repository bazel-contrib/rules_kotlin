# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: false

reviews:
  # Disable all automatic PR reviews and incremental follow-ups
  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    labels: []
    description_keyword: ""
    base_branches: []

  # Exclude all files from sparse-checkout/review context
  path_filters:
    - "!**"

  # Disable all PR summary, status, and blocking behaviors
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  review_status: false
  commit_status: false
  fail_commit_status: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  enable_prompt_for_ai_agents: false

  # Disable finishing touches (docstrings, unit tests, etc.)
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # Disable pre-merge checks
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  # Disable static analysis / linter tools
  tools:
    ast-grep:
      essential_rules: false
    shellcheck:
      enabled: false
    ruff:
      enabled: false
    markdownlint:
      enabled: false
    github-checks:
      enabled: false
    languagetool:
      enabled: false
    biome:
      enabled: false
    hadolint:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: false
    yamllint:
      enabled: false
    gitleaks:
      enabled: false
    checkov:
      enabled: false
    detekt:
      enabled: false
    eslint:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    actionlint:
      enabled: false
    pmd:
      enabled: false
    cppcheck:
      enabled: false
    semgrep:
      enabled: false
    circleci:
      enabled: false

chat:
  auto_reply: false

knowledge_base:
  # Opt out of data retention and purge stored learnings/context for this repo
  opt_out: true
  web_search:
    enabled: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  linked_repositories: []
